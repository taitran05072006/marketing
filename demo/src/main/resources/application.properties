spring.application.name=demo

# Cấu hình DataSource tiêu chuẩn hỗ trợ biến môi trường từ Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/marketing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# IMPORTANT: All secrets must be set as environment variables in production.
# Never commit real credentials to source control.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.pool_size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.tomcat.accesslog.enabled=false
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Cloudinary (Must be provided via environment variables in production)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# PayOS Configuration (Must be provided via environment variables in production)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# JWT (Must be provided via environment variables in production, minimum 64 characters)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend URL (CORS origin)
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Next.js Revalidation Webhook
nextjs.revalidate.url=${NEXTJS_REVALIDATE_URL:http://localhost:3000/api/revalidate}
nextjs.revalidate.secret=${NEXTJS_REVALIDATE_SECRET:}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server Error handling (Disable stack trace leakage in responses)
server.error.include-stacktrace=never
server.error.include-message=never