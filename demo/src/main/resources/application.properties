spring.application.name=demo
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Cloudinary (Mock values for now)
cloudinary.cloud_name=my_cloud_name
cloudinary.api_key=my_api_key
cloudinary.api_secret=my_api_secret


# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:3af9acec-5ff1-4f29-adc0-117052fa8aa6}
payos.api-key=${PAYOS_API_KEY:ef824c9f-be48-441b-a8f1-6f297fd8cfde}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:f1e20f9ad91c4f2f437c518f5782f4558d68784ea69579ac983f900416e3697d}

# JWT
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationWhichShouldBeLongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}